<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Docs Dark Mode</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="loading">
  <header>
    <img src="../icons/icon48.png" alt="" width="28" height="28">
    <h1>Docs Dark Mode</h1>
  </header>

  <label class="row" for="toggle">
    <span class="label">
      <span class="title">Dark mode</span>
      <span class="hint">Google Docs, images untouched</span>
    </span>
    <span class="switch">
      <input type="checkbox" id="toggle" role="switch">
      <span class="track"><span class="thumb"></span></span>
    </span>
  </label>

  <p class="note">Open documents reload to apply the change.</p>

  <script src="popup.js"></script>
</body>
</html>
